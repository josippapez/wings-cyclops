[package]
name = "cyclops"
version = "0.1.0"
edition = "2024"
publish = false
description = "Trial: Cyclops in Rust, built to WebAssembly for the native Wings app."

[lib]
crate-type = ["cdylib"]

[dependencies]
# The Rust SDK, from the Wings repo at the commit of Wings 0.2.17. For work on the SDK itself, point it at a checkout:
# cargo build --config 'patch."https://github.com/josippapez/Wings".wings-plugin.path="../../wings/packages/plugin-rs"'
wings-plugin = { git = "https://github.com/josippapez/Wings", rev = "4f06883c" }
serde = { version = "1", features = ["derive"] }
# Keys in the order they are written, so what a tool answers Claude reads as the TypeScript tool's did.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
# Which frame the module is: the sidebar with neither, the popover, or the main script. `build.sh` builds all three.
popover = []
main = []
# Made-up Cyclops answers in place of `wings.fetch` and the token, for rendering the page with nothing real behind it.
fake = []
