# Push a tag like v0.2.0 and this attaches a .wings-plugin file to a GitHub release.
# Wings installs and updates from that file when someone adds the repo by its link.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version wings-plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in wings-plugin.json"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The frames written in Rust, into dist/native/, which the package takes as they are.
      - name: Build the Rust frames
        run: |
          rustup target add wasm32-unknown-unknown
          sh rust/build.sh
      - name: Check, build and package
        run: npm ci && npm run check
      # wings-plugin pack ships every folder it doesn't know as source, and rust/ with its build folder is 80 MB.
      - name: Leave the Rust source out of the package
        run: zip -d "$(jq -r .id wings-plugin.json).wings-plugin" 'rust/*'
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(jq -r .id wings-plugin.json)
          gh release create "$GITHUB_REF_NAME" "$id.wings-plugin" --verify-tag --generate-notes
